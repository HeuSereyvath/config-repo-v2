server:
  port: ${SERVER_PORT:1009}

spring:
  application:
    name: customer-service

  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/customer_service1}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  liquibase:
    enabled: true
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/customer_service1}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
    client-id: ${KAFKA_CLIENT_ID:customer-service}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:customer-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed

    listener:
      ack-mode: record
      concurrency: ${KAFKA_CONCURRENCY:3}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:admin}
      password: ${REDIS_PASSWORD:admin}
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:room-media}

logging:
  level:
    root: INFO
    org.springframework.r2dbc: INFO
